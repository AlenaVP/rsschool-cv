<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Frontend</title>
</head>

<body>
  <header class="header">
    <div class="wrapper">
      <nav>
        <ul class="nav-list">
          <li class="list__item"><a href="#contacts" class="list__link nav-list__link">contacts</a></li>
          <li class="list__item"><a href="#skills" class="list__link nav-list__link">skills</a></li>
          <li class="list__item"><a href="#code" class="list__link nav-list__link">code</a></li>
          <li class="list__item"><a href="#portfolio" class="list__link nav-list__link">portfolio</a></li>
          <li class="list__item"><a href="#education" class="list__link nav-list__link">education</a></li>
          <li class="list__item"><a href="#languages" class="list__link nav-list__link">languages</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="wrapper">
      <div class="main-content">
        <section id="hero" class="main-section">
          <div class="hero__content">
            <h1 class="hero__title">Alena Papruha</h1>
          </div>
          <div class="hero__visual"></div>
          <div class="hero__facts"></div>
        </section>
        <section id="portfolio" class="main-section">
          <h2 class="section-title">selected projects</h2>
        </section>
        <section id="code" class="main-section">
          <h2 class="section-title">code example</h2>
        </section>
        <section id="education" class="main-section">
          <h2 class="section-title">education</h2>
        </section>
        <section id="languages" class="main-section">
          <h2 class="section-title">languages</h2>
        </section>
      </div>
      <aside class="sidebar">
        <section id="contacts">
          <h2 class="section-title">contacts</h2>
        </section>
        <section id="skills">
          <h2 class="section-title">key skills</h2>
        </section>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="wrapper">
      <div class="rss"></div>
      <div class="year"></div>
      <div class="github"></div>
    </div>
  </footer>
</body>

</html>
